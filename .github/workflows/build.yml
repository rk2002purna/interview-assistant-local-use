name: Build Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --include=optional
      - name: Verify native modules installed
        run: |
          echo "Checking for @lancedb native module..."
          dir node_modules\@lancedb\lancedb-win32-x64-msvc
          echo "Checking for apache-arrow..."
          dir node_modules\apache-arrow
          echo "Checking for sharp nested semver..."
          dir node_modules\sharp
          echo "Checking for onnxruntime-node win32 native binary (local embeddings)..."
          dir node_modules\onnxruntime-node\bin\napi-v3\win32\x64\onnxruntime_binding.node
          echo "Checking onnxruntime-node runtime DLLs are present next to the binding..."
          dir node_modules\onnxruntime-node\bin\napi-v3\win32\x64\*.dll
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --include=optional
      - run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/*.zip
